{% load static %}

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sidebar SOL</title>
    <link rel="stylesheet" href="{% static 'css/menu.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
    
    {% csrf_token %}
    <div class="sidebar">
        <div class="logo">
            <img src="{% static 'img/logo_ong.png' %}" alt="Logo SOL">
        </div>

        <div class="menu">
            <a href="/users/" class="{% if '/users' in request.path %}active{% endif %}">
                <i class="fas fa-user-alt"></i> Usuários
            </a>

            <a href="/equipments/" class="{% if '/equipments' in request.path %}active{% endif %}">
                <i class='fas fa-plus-square' style='font-size:22px'></i> Equipamentos
            </a>

            <a href="/persons/" class="{% if '/persons' in request.path %}active{% endif %}">
                <i class="fas fa-users"></i> Pessoas
            </a>

            <a href="/waitlist/" class="{% if '/waitlist' in request.path %}active{% endif %}">
                <i class="fa fa-address-book"></i> Lista de Espera
                <!-- <i class="fa fa-clock-o"></i> Pessoas -->
            </a>
        </div>

        <div id="button-deslogar" class="user-footer">
            <span id="username">Usuário</span>
            <i onclick="deslogarUsuario()" class="bi bi-box-arrow-right"></i>
        </div>
    </div>

</body>
<script>

    fetch(`/login/obter_usuario`)
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                $("#username").html(data.user.username);
            }
        })
        .catch(error => console.error('Erro ao buscar dados do usuário:', error));

    function deslogarUsuario() {
        const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;
        fetch(`/login/deslogar`, {
            method: "POST",
            headers: {
                "X-CSRFToken": csrfToken
            }
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    window.location.href = '/users';
                }
            })
            .catch(error => console.error('Erro ao buscar dados do usuário:', error));
    }

    function checkSession() {
        fetch('/login/check_session')
            .then(response => response.json())
            .then(data => {
                if (!data.logged_in) {
                    window.location.href = '/login/';
                }
            })
            .catch(err => console.error('Erro ao verificar sessão:', err));
    }

    setInterval(checkSession, 15000);

</script>
</html>
