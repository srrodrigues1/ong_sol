{% load static %}

<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="{% static 'persons/css/sidebar_add.css' %}">
</head>
</html>

<div id="sidebar" class="sidebar-container">

    <div class="sidebar-overlay"></div> <!-- onclick="closeSidebar() -->

    <div class="sidebar-content">
        <div class="sidebar-header d-flex justify-content-between align-items-center">
            <h2 id="sidebar-title" class="sidebar-title">Criar Usuário</h2>
            <button class="btn-close" onclick="closeAddSidebar()"></button>
        </div>

        <div id="loading-overlay-add" class="loading-overlay" style="display: none">
            <img src="{% static 'img/loading_icon.gif' %}" alt="Carregando..." width="50">        
        </div>

        <div id="mensagem-pessoa"></div>
        
        <div class="sidebar-body">
            <form id="form-pessoa" class="form-pessoa" method="post" action="{% url 'criar_pessoa' %}">
                {% csrf_token %}
                <div class="mb-2">
                    <label for="name" class="form-label">Nome Completo</label>
                    <input type="text" onkeydown="removeRequiredStyle(this)" class="form-control" id="name" placeholder="Nome" name="name">
                </div>
                <div class="mb-2">
                    <label for="birth_date" class="form-label">Data de Nascimento</label>
                    <input type="text" onkeydown="removeRequiredStyle(this)" class="form-control" id="birth_date" placeholder="dd/mm/aaaa" name="birth_date">
                </div>
                <div class="mb-2">
                    <label for="cpf" class="form-label">CPF</label>
                    <input type="text" onkeydown="removeRequiredStyle(this)" onkeyup="formatarCPF()" class="form-control" id="cpf" placeholder="CPF" name="cpf">
                </div>
                <div class="mb-2">
                    <label for="email" class="form-label">E-mail</label>
                    <input type="email" onkeydown="removeRequiredStyle(this)" class="form-control" id="email" placeholder="E-mail" name="email">
                </div>
                <div class="mb-2 d-flex gap-2">
                    <div class="flex-fill" style="max-width:120px;">
                        <label for="phone" class="form-label">DDD</label>
                        <input type="text" onkeydown="removeRequiredStyle(this)" maxlength="2" class="form-control" id="ddd" placeholder="DDD" name="ddd">
                    </div>
                    <div class="flex-fill">
                        <label for="phone" class="form-label">Telefone</label>
                        <input type="text" onkeydown="removeRequiredStyle(this)" onkeyup="formatarTelefone(this)" maxlength="11" class="form-control" id="phone" placeholder="Telefone" name="phone">
                    </div>
                </div>

                <div class="mb-2 d-flex gap-2">
                    <div class="flex-fill">
                        <label for="cep" class="form-label">CEP</label>
                        <input type="cep" onkeydown="removeRequiredStyle(this)" maxlength="8" class="form-control" id="cep" placeholder="CEP" name="cep">
                        <label id="cep-message" class="float-start" style="font-size: 10px; color: #ff0000; display: none;"></label>
                    </div>
                    <div class="flex-fill">
                        <label for="state" class="form-label">Estado</label>
                        <input type="text" onkeydown="removeRequiredStyle(this)" class="form-control" id="state" placeholder="Estado" name="state">
                    </div>
                </div>

                <div class="mb-2">
                    <label for="city" class="form-label">Cidade</label>
                    <input type="text" onkeydown="removeRequiredStyle(this)" class="form-control" id="city" placeholder="Cidade" name="city">
                </div>
                <div class="mb-2">
                    <label for="district" class="form-label">Bairro</label>
                    <input type="district" onkeydown="removeRequiredStyle(this)" class="form-control" id="district" placeholder="Bairro" name="district">
                </div>
                <div class="mb-2 d-flex gap-2">
                    <div class="flex-fill">
                        <label for="street" class="form-label">Rua</label>
                        <input type="text" onkeydown="removeRequiredStyle(this)" class="form-control" id="street" placeholder="Rua" name="street">
                    </div>
                    <div class="flex-fill" style="max-width:120px;">
                        <label for="st_number" class="form-label">Número</label>
                        <input type="text" onkeydown="removeRequiredStyle(this)" class="form-control" id="st_number" placeholder="Nº" name="st_number">
                    </div>
                </div>

                <div class="mb-2">
                    <label for="documents" class="form-label">Anexos</label>
                    <input type="file" class="form-control" id="documents" name="documents[]" multiple accept="image/*,.pdf,.doc,.docx">

                    <!-- Lista de arquivos já carregados do banco -->
                    <div id="uploaded-files" class="mt-2">

                    </div>

                    <!-- Pré-visualização dos novos uploads -->
                    <div id="preview-files" class="mt-2"></div>
                </div>

                <div class="form-buttons d-flex justify-content-end mt-4">
                    <button id="btn-cancelar-add" type="button" class="btn btn-outline-success me-2" onclick="closeAddSidebar()">Cancelar</button>
                    <button id="btn-salvar-add" type="submit" class="btn btn-success">Salvar</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="{% static 'js/jquery-3.7.1.min.js' %}"></script>
<script>
    document.getElementById('form-pessoa').addEventListener('submit', function(e) {
        e.preventDefault();
        const form = e.target;

        handleFormOnSave();
        if (validateFormAdd(form) > 0) {
            handleFormOnResponse(0);
            return;
        }

        toastr.options.closeButton = true;
        toastr.options.timeOut = 10000;
        toastr.options.extendedTimeOut = 0;
        toastr.options.preventDuplicates = true;

        const formData = new FormData(form);
        
        fetch('/persons/novo', {
            method: 'POST',
            body: formData
        })
        .then(response => {
            handleFormOnResponse(1);
            const contentType = response.headers.get('content-type');
            if (contentType && contentType.includes('application/json')) {
                return response.json();
            } 
        })
        .then(data => {
            if (!data) return;

            const mensagemDiv = document.getElementById('mensagem-pessoa');
            mensagemDiv.innerHTML = '';

            if (data.success) {
                form.reset();
                toastr.success(data.success);
                atualizarTabelaPessoas();
                closeAddSidebar();
            } else if (data.error) {
                let listaErros = '';

                for (let campo in data.error) {
                    console.log(data.error[campo]);
                    listaErros += ' - ' + data.error[campo] + '<br>'
                    const campoEl = document.getElementById(campo);
                    if (campoEl) {
                        campoEl.style.borderColor = '#eb0000';
                    }
                }
                toastr.warning(listaErros);
            }
        })
        .catch(error => {
            // console.error('Erro:', error);
        });

    });

    function removeRequiredStyle(input) {
        input.style = 'border-color: #ced4da';
    }

    function resetForm(form) {
        form.find("input[type=text], input[type=password], input[type=email], textarea").val("");
        form.find("select").prop("selectedIndex", 0);
        $("#name").css("border-color", "#ced4da");
        $("#cpf").css("border-color", "#ced4da");
        $("#email").css("border-color", "#ced4da");
        $("#ddd").css("border-color", "#ced4da");
        $("#birth_date").css("border-color", "#ced4da");
        $("#phone").css("border-color", "#ced4da");
        $("#cep").css("border-color", "#ced4da");
        $("#state").css("border-color", "#ced4da");
        $("#city").css("border-color", "#ced4da");
        $("#district").css("border-color", "#ced4da");
        $("#street").css("border-color", "#ced4da");
        $("#st_number").css("border-color", "#ced4da");
    }

    function validateFormAdd(form) {

        var errors = 0;
        const name = form.name.value.trim();
        const cpf = form.cpf.value.trim();
        const email = form.email.value.trim();
        const ddd = form.ddd.value.trim();
        const phone = form.phone.value;
        const birth_date = form.birth_date.value;
        const cep = form.cep.value;
        const state = form.state.value;
        const city = form.city.value;
        const district = form.district.value;
        const street = form.street.value;
        const st_number = form.street.value;

        if (!name) {
            form.name.style = 'border-color: #eb0000';
            errors++;
        }
        if (!cpf) {
            form.cpf.style = 'border-color: #eb0000';
            errors++;
        }
        if (!email) {
            form.email.style = 'border-color: #eb0000';
            errors++;
        }
        if (!ddd) {
            form.ddd.style = 'border-color: #eb0000';
            errors++;
        }
        if (!phone) {
            form.phone.style = 'border-color: #eb0000';
            errors++;
        }
        if (!cep) {
            form.cep.style = 'border-color: #eb0000';
            errors++;
        }
        if (!state) {
            form.state.style = 'border-color: #eb0000';
            errors++;
        }
        if (!city) {
            form.city.style = 'border-color: #eb0000';
            errors++;
        }
        if (!district) {
            form.district.style = 'border-color: #eb0000';
            errors++;
        }
        if (!birth_date) {
            form.birth_date.style = 'border-color: #eb0000';
            errors++;
        }
        if (!street) {
            form.street.style = 'border-color: #eb0000';
            errors++;
        }
        if (!st_number) {
            form.st_number.style = 'border-color: #eb0000';
            errors++;
        }
        return errors;
    }

    function closeAddSidebar() {
        let form = $('#form-pessoa');
        resetForm(form);

        document.getElementById('sidebar').classList.remove('active');
    }

    function formatarCPF() {
        const cpfInput = document.getElementById("cpf");
        let cpf = cpfInput.value.replace(/\D/g, ''); // Remove não-números

        if (cpf.length > 11) cpf = cpf.slice(0, 11); // Limita a 11 dígitos

        let cpfFormatado = '';

        if (cpf.length > 9) {
            cpfFormatado = cpf.replace(/(\d{3})(\d{3})(\d{3})(\d{0,2})/, "$1.$2.$3-$4");
        } else if (cpf.length > 6) {
            cpfFormatado = cpf.replace(/(\d{3})(\d{3})(\d{0,3})/, "$1.$2.$3");
        } else if (cpf.length > 3) {
            cpfFormatado = cpf.replace(/(\d{3})(\d{0,3})/, "$1.$2");
        } else {
            cpfFormatado = cpf;
        }

        cpfInput.value = cpfFormatado;
    }

    function handleFormOnSave() {
        $("#loading-overlay-add").show();
        $("#btn-cancelar-add").prop("disabled", true);
        $("#btn-salvar-add").prop("disabled", true);
    }

    function handleFormOnResponse(serverSideValidation) {

        if (serverSideValidation == 1) {
            setTimeout(function() {
                $("#loading-overlay-add").hide();
                $("#btn-cancelar-add").prop("disabled", false);
                $("#btn-salvar-add").prop("disabled", false);   
            }, 500);

            return;
        }

        $("#loading-overlay-add").hide();
        $("#btn-cancelar-add").prop("disabled", false);
        $("#btn-salvar-add").prop("disabled", false);    
    }

    function limpa_formulário_cep() {
        $("#state").val("");
        $("#district").val("");
        $("#city").val("");
        $("#street").val("");
    }

    $("#cep").blur(function() {
        var cep = $("#cep").val().replace(/\D/g, '');
        if (cep != "") {

            var validacep = /^[0-9]{8}$/;

            //Valida o formato do CEP.
            if(validacep.test(cep)) {

                //Preenche os campos com "..." enquanto consulta webservice.
                $("#street").val("...");
                $("#district").val("...");
                $("#city").val("...");
                $("#state").val("...");

                //Consulta o webservice viacep.com.br/
                $.getJSON("https://viacep.com.br/ws/"+ cep +"/json/?callback=?", function(dados) {

                    if (!("erro" in dados)) {
                        //Atualiza os campos com os valores da consulta.
                        $("#street").val(dados.logradouro);
                        $("#district").val(dados.bairro);
                        $("#city").val(dados.localidade);
                        $("#state").val(dados.uf);
                        $("#cep-message").hide()
                        $("#cep").css("border-color", "#ced4da");
                        $("#state").css("border-color", "#ced4da");
                        $("#city").css("border-color", "#ced4da");
                        $("#district").css("border-color", "#ced4da");
                        $("#street").css("border-color", "#ced4da");
                    } //end if.
                    else {
                        //CEP pesquisado não foi encontrado.
                        limpa_formulário_cep();
                        $("#cep-message").text("CEP não encontrado");
                        $("#cep-message").show()
                    }
                });
            } //end if.
            else {
                //cep é inválido.
                limpa_formulário_cep();
                $("#cep-message").text("Formato de CEP inválido.");
                $("#cep-message").show()
            }
        } //end if.
        else {
            //cep sem valor, limpa formulário.
            limpa_formulário_cep();
        }
    })

    function formatarTelefone(input) {
        let value = input.value.replace(/\D/g, '');

        value = value.substring(0, 9);

        if (value.length > 5) {
            input.value = value.replace(/^(\d)(\d{4})(\d{0,4})$/, "$1 $2-$3");
        } else if (value.length > 1) {
            input.value = value.replace(/^(\d)(\d{0,4})$/, "$1 $2");
        } else {
            input.value = value;
        }
    }

    document.getElementById('birth_date').addEventListener('input', function (e) {
        let value = e.target.value.replace(/\D/g, '');
        if (value.length > 8) value = value.slice(0, 8);

        let formatted = '';
        if (value.length > 4) {
            formatted = value.replace(/(\d{2})(\d{2})(\d{0,4})/, '$1/$2/$3');
        } else if (value.length > 2) {
            formatted = value.replace(/(\d{2})(\d{0,2})/, '$1/$2');
        } else {
            formatted = value;
        }
        e.target.value = formatted;
    });

</script>
