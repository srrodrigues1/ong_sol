{% load static %}

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Grupo de Solidariedade</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
    }

    .login-container {
      background: #fff;
      padding: 20px 30px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      width: 300px;
      text-align: center;
    }

    .logo {
      margin-bottom: 20px;
    }

    .logo img {
      width: 300px;
    }

    .logo-text {
      font-size: 14px;
      color: #333;
    }

    .logo-text span {
      color: #2ecc71;
      font-weight: bold;
    }

    .login-container input {
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    .login-container button {
      width: 100%;
      padding: 10px;
      background: #16a34a;
      border: none;
      border-radius: 4px;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .login-container button:hover {
      background: #15803d;
    }

    .wave {
      position: absolute;
      bottom: 0;
      left: 0;
      z-index: -1;
    }

    .login-container form .form-group {
      display: flex;
      flex-direction: column;
      margin-bottom: 12px;
    }

    .login-container form label {
      font-size: 13px;
      color: #333;
      margin-bottom: 4px;
      text-align: left;
    }

    .login-container form input {
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

  </style>
</head>
<body>

  <div class="logo">
    <img src="{% static 'img/logo_ong.png' %}" alt="Logo Grupo de Solidariedade">
  </div>

  <div class="login-container">
    <form method="post" action="{% url 'logar' %}">
      {% csrf_token %}>
      <div class="form-group">
        <label for="cpf">CPF</label>
        <input type="text" id="cpf" name="cpf" placeholder="CPF" required>
      </div>

      <div class="form-group">
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" placeholder="Senha" required>
      </div>

      <button type="submit">Entrar</button>
    </form>
  </div>
