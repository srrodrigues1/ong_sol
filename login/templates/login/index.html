{% load static %}

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="{% static 'css/toastr.min.css' %}">
  <link rel="icon" type="image/png" href="{% static 'img/favicon.png' %}">
  <title>Login</title>
  <style>

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
    }

    .login-container {
      background: #fff;
      padding: 20px 30px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      width: 300px;
      text-align: center;
    }

    .logo {
      margin-bottom: 20px;
    }

    .logo img {
      width: 300px;
    }

    .logo-text {
      font-size: 14px;
      color: #333;
    }

    .logo-text span {
      color: #2ecc71;
      font-weight: bold;
    }

    .login-container input {
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    .login-container button {
      width: 100%;
      padding: 10px;
      background: #16a34a;
      border: none;
      border-radius: 4px;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .login-container button:hover {
      background: #15803d;
    }

    .wave {
      position: absolute;
      bottom: 0;
      left: 0;
      z-index: -1;
    }

    .login-container form .form-group {
      display: flex;
      flex-direction: column;
      margin-bottom: 12px;
    }

    .login-container form label {
      font-size: 13px;
      color: #333;
      margin-bottom: 4px;
      text-align: left;
    }

    .login-container form input {
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

  </style>
</head>
<body>

  <div class="logo">
    <img src="{% static 'img/logo_ong.png' %}" alt="Logo Grupo de Solidariedade">
  </div>

  <div class="login-container">
    <form method="post" id="form-login" action="{% url 'login:logar' %}">
      {% csrf_token %}
      <div class="form-group">
        <label for="cpf">CPF</label>
        <input type="text" onkeyup="formatarCPF()" id="cpf" name="cpf" placeholder="CPF" required>
      </div>

      <div class="form-group">
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" placeholder="Senha" required>
      </div>

      <button type="submit">Entrar</button>
    </form>
  </div>

</body>
<script src="{% static 'js/jquery-3.7.1.min.js' %}"></script>
<script src="{% static 'js/toastr.min.js' %}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>

document.getElementById('form-login').addEventListener('submit', function(e) {
  e.preventDefault();
  const form = e.target;

  toastr.options.closeButton = true;
  toastr.options.timeOut = 1000;
  toastr.options.progressBar = true;
  toastr.options.extendedTimeOut = 0;
  toastr.options.preventDuplicates = true;

  const formData = new FormData(form);

  fetch("{% url 'login:logar' %}", {
    method: "POST",
    body: formData,
  }).then(response => response.json()
  ).then(data => {
    if (data.success) {
      toastr.success(data.message);
      window.location.href = '/users';
    } else {
      toastr.error(data.message);
    }
  })
  .catch(error => {
    console.error("Erro na requisição:", error);
  });

})

  function formatarCPF() {
      const cpfInput = document.getElementById("cpf");
      let cpf = cpfInput.value.replace(/\D/g, '');

      if (cpf.length > 11) cpf = cpf.slice(0, 11);

      let cpfFormatado = '';

      if (cpf.length > 9) {
          cpfFormatado = cpf.replace(/(\d{3})(\d{3})(\d{3})(\d{0,2})/, "$1.$2.$3-$4");
      } else if (cpf.length > 6) {
          cpfFormatado = cpf.replace(/(\d{3})(\d{3})(\d{0,3})/, "$1.$2.$3");
      } else if (cpf.length > 3) {
          cpfFormatado = cpf.replace(/(\d{3})(\d{0,3})/, "$1.$2");
      } else {
          cpfFormatado = cpf;
      }

      cpfInput.value = cpfFormatado;
  }

</script>
</html>
