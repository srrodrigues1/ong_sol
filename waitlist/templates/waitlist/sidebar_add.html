{% load static %}

<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="{% static 'waitlist/css/sidebar_add.css' %}">
</head>
</html>

<div id="sidebar" class="sidebar-container">

    <div class="sidebar-overlay"></div> <!-- onclick="closeSidebar() -->

    <div class="sidebar-content">
        <div class="sidebar-header d-flex justify-content-between align-items-center">
            <h2 id="sidebar-title" class="sidebar-title">Criar Espera</h2>
            <button class="btn-close" onclick="closeAddSidebar()"></button>
        </div>

        <div id="loading-overlay-add" class="loading-overlay" style="display: none">
            <img src="{% static 'img/loading_icon.gif' %}" alt="Carregando..." width="50">        
        </div>

        <div id="mensagem-usuario"></div>
        
        <div class="sidebar-body">
            <form id="form-waitlist" class="form-waitlist" method="post" action="{% url 'criar_waitlist' %}">
                {% csrf_token %}
                <div class="mb-2">
                    <label for="person" class="form-label">Nome</label>
                    <select onchange="removeRequiredStyle(this)" class="form-select" id="person" name="person">
                    </select>
                </div>
                <div class="mb-2">
                    <label for="equipment" class="form-label">Item desejado</label>
                    <select onchange="removeRequiredStyle(this)" class="form-select" id="equipment" name="equipment">
                    </select>
                </div>
                <div class="mb-2" id="dt_contact_div">
                    <label for="dt_contact" class="form-label">Data que entrou em contato</label>
                    <input type="text" onkeyup="removeRequiredStyle(this)" class="form-control" id="dt_contact" placeholder="dd/mm/aaaa" name="dt_contact" maxlength="10">
                </div>

                <div class="form-buttons d-flex justify-content-end mt-4">
                    <button id="btn-cancelar-add" type="button" class="btn btn-outline-success me-2" onclick="closeAddSidebar()">Cancelar</button>
                    <button id="btn-salvar-add" type="submit" class="btn btn-success">Salvar</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>

    document.getElementById('dt_contact').addEventListener('input', function (e) {
        let value = e.target.value.replace(/\D/g, '');
        if (value.length > 8) value = value.slice(0, 8);

        let formatted = '';
        if (value.length > 4) {
            formatted = value.replace(/(\d{2})(\d{2})(\d{0,4})/, '$1/$2/$3');
        } else if (value.length > 2) {
            formatted = value.replace(/(\d{2})(\d{0,2})/, '$1/$2');
        } else {
            formatted = value;
        }
        e.target.value = formatted;
    });

    document.getElementById('form-waitlist').addEventListener('submit', function(e) {
        e.preventDefault();
        const form = e.target;

        handleFormOnSave();
        if (validateFormAdd(form) > 0) {
            handleFormOnResponse(0);
            return;
        }

        toastr.options.closeButton = true;
        toastr.options.timeOut = 10000;
        toastr.options.extendedTimeOut = 0;
        toastr.options.preventDuplicates = true;

        const formData = new FormData(form);
        
        fetch('/waitlist/novo', {
            method: 'POST',
            body: formData
        })
        .then(response => {
            handleFormOnResponse(1);
            const contentType = response.headers.get('content-type');
            if (contentType && contentType.includes('application/json')) {
                return response.json();
            } 
        })
        .then(data => {
            if (!data) return;

            const mensagemDiv = document.getElementById('mensagem-usuario');
            mensagemDiv.innerHTML = '';

            if (data.success) {
                form.reset();
                toastr.success(data.success);
                atualizarTabelaWaitlist();
                closeAddSidebar();
            } else if (data.error) {
                let listaErros = '';

                for (let campo in data.error) {
                    listaErros += ' - ' + data.error[campo] + '<br>'
                    const campoEl = document.getElementById(campo);
                    if (campoEl) {
                        campoEl.style.borderColor = '#eb0000';
                    }
                }
                toastr.warning(listaErros);
            }
        })
        .catch(error => {
            // console.error('Erro:', error);
        });

    });

    function removeRequiredStyle(input) {
        input.style = 'border-color: #ced4da';
    }

    function resetForm(form) {
        form.find("input[type=text], input[type=password], input[type=email], textarea").val("");
        form.find("select").prop("selectedIndex", 0);
        $("#person").css("border-color", "#ced4da");
        $("#equipment").css("border-color", "#ced4da");
        $("#dt_contact").css("border-color", "#ced4da");
    }

    function validateFormAdd(form) {

        let erros = 0
        const person = form.person.value.trim();
        const equipment = form.equipment.value.trim();
        const dt_contact = form.dt_contact.value.trim();

        if (!person) {
            form.person.style = 'border-color: #eb0000';
            erros += 1;
        }
        if (!equipment) {
            form.type.style = 'border-color: #eb0000';
            erros += 1;
        }
        if (!dt_contact) {
            form.dt_contact.style = 'border-color: #eb0000';
            erros += 1;
        }

        return erros;
    }

    function openAddSidebar() {
        const $sidebar = $('#sidebar');
        const $selectPerson = $('#person'); // select de pessoas
        const $selectEquipment = $('#equipment'); // select de equipamentos

        // limpa os selects
        $selectPerson.empty().append('<option value="">Selecione uma pessoa...</option>');
        $selectEquipment.empty().append('<option value="">Selecione um equipamento...</option>');

        // faz uma única requisição
        $.ajax({
            url: '/waitlist/info_form',
            type: 'GET',
            dataType: 'json',
            success: function(data) {
                // popula pessoas
                $.each(data.persons, function(index, person) {
                    $selectPerson.append(`<option value="${person.id}">${person.name}</option>`);
                });

                // popula equipamentos
                $.each(data.equipments, function(index, equipment) {
                    const typeLabel = equipment.type ? ` (${equipment.type})` : '';
                    $selectEquipment.append(`<option value="${equipment.id}">${equipment.name}${typeLabel}</option>`);
                });

                // abre o sidebar depois de popular tudo
                $sidebar.addClass('active');
            },
            error: function(xhr, status, error) {
                console.error('Erro ao carregar informações do formulário:', error);
            }
        });

        const person = document.getElementById('person');
        const equipment = document.getElementById('equipment');
        if (person) person.style = 'border-color: #ced4da';
        if (equipment) equipment.style = 'border-color: #ced4da';
    }

    function closeAddSidebar() {
        let form = $('#form-waitlist');
        resetForm(form);

        document.getElementById('sidebar').classList.remove('active');
    }

    function handleFormOnSave() {
        $("#loading-overlay-add").show();
        $("#btn-cancelar-add").prop("disabled", true);
        $("#btn-salvar-add").prop("disabled", true);
    }

    function handleFormOnResponse(serverSideValidation) {

        if (serverSideValidation == 1) {
            setTimeout(function() {
                $("#loading-overlay-add").hide();
                $("#btn-cancelar-add").prop("disabled", false);
                $("#btn-salvar-add").prop("disabled", false);   
            }, 500);

            return;
        }

        $("#loading-overlay-add").hide();
        $("#btn-cancelar-add").prop("disabled", false);
        $("#btn-salvar-add").prop("disabled", false);    
    }

</script>
