{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Lista de Espera</title>
    <link rel="stylesheet" href="{% static 'users/css/index.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/bootstrap-table@1.21.0/dist/bootstrap-table.min.css">
    <link rel="stylesheet" href="https://unpkg.com/bootstrap-table@1.21.0/dist/extensions/filter-control/bootstrap-table-filter-control.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/png" href="{% static 'img/favicon.png' %}">
</head>
<body class="body-waitlist">

    <!-- === MODAL DE CONFIRMAÇÃO DE EXCLUSÃO ================================ -->
    <div class="modal fade" id="deleteConfirmModal" tabindex="-1" aria-labelledby="deleteConfirmLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content shadow-sm">
                <div class="modal-header">
                    <h5 class="modal-title" id="deleteConfirmLabel">
                        <i class="fa fa-triangle-exclamation text-danger me-2"></i>
                        Confirmar exclusão
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>

                <div class="modal-body">
                    Tem certeza de que deseja excluir o equipamento <strong id="delete-username">...</strong>?
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-danger" id="btn-confirm-delete">
                        <i class="fa fa-trash me-1"></i> Excluir
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="d-flex">

        {% include 'menu.html' %}
        {% include 'waitlist/sidebar_add.html' %}
        {% include 'waitlist/sidebar_edit.html' %}

        <div id="sidebar-content"></div>
        <div id="sidebar-edit-content"></div>

        <div class="content flex-grow-1 p-4">
            <div class="container">
                <div>
                    <h3 class="text page-label">Lista de Espera</h3>
                </div>
                <div class="d-flex justify-content-end align-items-end mb-2">
                    <button class="btn btn-add" onclick="openAddSidebar()">
                        <i class="fa fa-plus"></i> Adicionar
                    </button>
                    <button class="btn btn-outline-secondary ms-2" id="exportar-dados">Exportar dados</button>
                </div>

                <div id="hide-table" style="visibility: hidden">
                    {% include 'waitlist/tabela_waitlist.html' %}
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/jquery-3.7.1.min.js' %}"></script>
    <script src="https://unpkg.com/bootstrap-table@1.21.0/dist/bootstrap-table.min.js"></script>
    <script src="https://unpkg.com/bootstrap-table@1.21.0/dist/extensions/filter-control/bootstrap-table-filter-control.min.js"></script>
<script>

    let DELETE_MODAL = null;
    let deleteUserId = null;

    function initTooltips() {
        const tooltipTriggerList = [].slice.call(
            document.querySelectorAll('[data-bs-toggle="tooltip"]')
        );
        tooltipTriggerList.map(function (tooltipTriggerEl) {
            return new bootstrap.Tooltip(tooltipTriggerEl, {
                delay: { show: 500, hide: 100 }
            });
        });
    }

    function loadTableEvents() {
        $('#tabela-waitlist').bootstrapTable({
            formatShowingRows: function (pageFrom, pageTo, totalRows) {
                return 'Mostrando <b>' + pageFrom + '-' + pageTo + '</b> de <b>' + totalRows + '</b> esperas.';
            },
            locale: 'pt-BR'
        });

        $('#tabela-waitlist').on('post-body.bs.table search.bs.table', function () {
            initTooltips();
        });

        initTooltips();

        // Editar equipamento
        $('#tabela-waitlist').on('click', 'a.text-primary', function (event) {
            event.preventDefault();

            const waitlistId = $(this).closest('tr').data('id');
            if (!waitlistId) return;

            fetch(`/waitlist/${waitlistId}`)
            .then(response => response.json())
            .then(data => {
                $('#sidebar-title-edit').text(data.name);

                const $inputID = $('#id_edit');
                const $selectPerson = $('#person_edit'); // select de pessoas
                const $selectEquipment = $('#equipment_edit'); // select de equipamentos
                const $inputContact = $("#dt_contact_edit");

                $selectPerson.empty();
                $selectEquipment.empty();

                $.ajax({
                    url: '/waitlist/info_form',
                    type: 'GET',
                    dataType: 'json',
                    success: function(info) {   
                        $.each(info.persons, function(index, person) {
                            $selectPerson.append(`<option value="${person.id}">${person.name}</option>`);
                        });

                        $.each(info.equipments, function(index, equipment) {
                            const typeLabel = equipment.type ? ` (${equipment.type})` : '';
                            $selectEquipment.append(`<option value="${equipment.id}">${equipment.name}${typeLabel}</option>`);
                        });

                        $inputID.val(data.id);
                        $selectPerson.val(data.person_id);
                        $selectEquipment.val(data.equipment_id);
                        $inputContact.val(data.dt_contact);

                    },
                    error: function(xhr, status, error) {
                        console.error('Erro ao carregar informações do formulário:', error);
                    }
                });

                openEditSidebar();
            })
            .catch(error => console.error('Erro ao buscar dados do equipamento:', error));
        });

        $('#tabela-waitlist').on('click', 'a.text-danger', function (e) {
            e.preventDefault();

            const $row     = $(this).closest('tr');
            deleteUserId   = $row.data('id');
            const username = $row.children('td').eq(0).text();

            $('#delete-username').text(username);
            DELETE_MODAL.show();
        });
    }

    $(document).ready(function () {
        atualizarTabelaWaitlist();
        $("#hide-table").css("visibility", "visible");

        // ---------------------------------------------------------------------
        // Configuração do modal de exclusão
        // ---------------------------------------------------------------------
        const deleteModalEl = document.getElementById('deleteConfirmModal');
        DELETE_MODAL = new bootstrap.Modal(deleteModalEl);

        // Botão "Excluir" no modal
        $('#btn-confirm-delete').on('click', function () {
            if (!deleteUserId) return;

            fetch(`/waitlist/delete/${deleteUserId}/`, {
                method: 'POST',
                headers: {
                    'X-CSRFToken': '{{ csrf_token }}'
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    toastr.success('Espera removida com sucesso');
                    DELETE_MODAL.hide();
                    atualizarTabelaWaitlist();
                    deleteUserId = null;
                } else {
                    toastr.error(data.error)
                    DELETE_MODAL.hide();
                    deleteUserId = null;
                }
            })
        });

        $('#exportar-dados').on('click', function() {
            fetch(`/waitlist/list`, {
                method: 'GET'
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error("Erro ao exportar equipamentos");
                }
                return response.blob();
            })
            .then(blob => {
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = "equipamentos.csv";
                document.body.appendChild(a);
                a.click();
                a.remove();
                window.URL.revokeObjectURL(url);
            })
            .catch(error => {
                console.error(error);
                alert("Falha ao baixar o CSV.");
            });
        })
    });

    async function atualizarTabelaWaitlist() {
        const response = await fetch("{% url 'waitlist_parciais' %}");
        const html = await response.text();
        document.querySelector("#hide-table").innerHTML = html;

        loadTableEvents();
    }

    function obterStatus(status) {
        switch (status) {
            case 0:
                return "Inativo"
            case 1:
                return "Disponível"
            case 2:
                return "Emprestado"
            case 3:
                return "Em Conserto"
            case 4:
                return "Extraviado"
            case 5:
                return "Avariado"
        }

    }
</script>

</body>
</html>
